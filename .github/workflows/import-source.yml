name: One-shot source import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Teseus source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .import/teseus_clean.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git commit -m "Import Teseus source from supplied archive"
          git push
