name: Complete Teseus import

on:
  push:
    paths:
      - '.github/workflows/import-teseus.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack Teseus
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part_* > .import/archive.b64
          base64 -d .import/archive.b64 > .import/teseus.tar.xz
          echo "5eea1294bec3afc959d46b72b175af86de32a13cfa32d859d879597db5a73330  .import/teseus.tar.xz" | sha256sum -c -
          tar -xJf .import/teseus.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-teseus.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Teseus 1.29.6 source"
          git push
