[pytest]
testpaths = tests
addopts = --ignore=tests/fixtures
markers =
    performance: wall-clock and hot-path workloads
    slow: subprocess, timeout and worker-recovery tests
    roadmap: roadmap and milestone contract tests
    release: clean-wheel installed acceptance tests
    scale: correctness checks at increased worker/campaign scale
    soak: long-running resource and churn checks
    mutation: critical mutation-quality gate
